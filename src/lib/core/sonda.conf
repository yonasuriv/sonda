#!/bin/bash
# Sonda Master Configuration File
# This file defines all paths and configuration variables used across all modes
# Call load_sonda_config() function to load and export all variables

load_sonda_config() {
    # This function loads all configuration variables and automatically exports them
    # All variables defined here will be exported when the function is called
    
    # ============================================================================
    # VERSION
    # ============================================================================
    SONDA_VERSION="1.8.7"
    
    # ============================================================================
    # BASE PATHS (set by main script before calling this function)
    # ============================================================================
    # These should be set by the main sonda script:
    # INSTALLDIR - Installation directory
    # MODES_DIR - Modes directory ($INSTALLDIR/modes)
    # CHECK_MODE_DIR - Check mode directory ($MODES_DIR/check)
    # AUDIT_MODE_DIR - Audit mode directory ($MODES_DIR/audit)
    # SHARED_LIB_DIR - Shared library directory ($INSTALLDIR/lib)
    # SHARED_CORE_DIR - Shared core directory ($SHARED_LIB_DIR/core)
    
    # ============================================================================
    # SHARED CORE FILES (used by all modes)
    # ============================================================================
    SONDA_CONFIG_FILE="$SHARED_CORE_DIR/sonda.conf"
    SONDA_SHARED_CORE="$SHARED_CORE_DIR"
    SONDA_DEFAULT="$SHARED_CORE_DIR/default"
    SONDA_SYSINFO="$SHARED_CORE_DIR/sysinfo"
    SONDA_NETINFO="$SHARED_CORE_DIR/netinfo"
    SONDA_STYLE="$SHARED_CORE_DIR/style"
    
    # ============================================================================
    # MODE DIRECTORIES
    # ============================================================================
    SONDA_MODE_DIR="$MODES_DIR"
    SONDA_AUDIT_MODE_DIR="$AUDIT_MODE_DIR"
    SONDA_CHECK_MODE_DIR="$CHECK_MODE_DIR"
    
    # ============================================================================
    # CHECK MODE PATHS
    # ============================================================================
    CHECK_MODE_LIB_DIR="$CHECK_MODE_DIR/helpers"
    CHECK_MODE_MODULES_DIR="$CHECK_MODE_DIR/modules"
    CHECK_MODE_PREFERENCES="$CHECK_MODE_DIR/default.conf"
    
    # Check mode files
    CHECK_MODE_STYLE="$SHARED_CORE_DIR/style"
    CHECK_MODE_LOGIC="$CHECK_MODE_LIB_DIR/logic"
    CHECK_MODE_LOGGER="$CHECK_MODE_LIB_DIR/logger"
    CHECK_MODE_MANUAL="$CHECK_MODE_LIB_DIR/man"
    CHECK_MODE_LOGO="$CHECK_MODE_LIB_DIR/top"
    CHECK_MODE_BANNER="$CHECK_MODE_LIB_DIR/banner"
    CHECK_MODE_CONFIG_FILE="$CHECK_MODE_LIB_DIR/config.sh"
    
    # Check mode shortcuts (for backward compatibility and convenience)
    CHECK_LIB="$CHECK_MODE_LIB_DIR"
    CHECK_MODULES="$CHECK_MODE_MODULES_DIR"
    CHECK_STYLE="$CHECK_MODE_STYLE"
    CHECK_LOGIC="$CHECK_MODE_LOGIC"
    CHECK_LOGGER="$CHECK_MODE_LOGGER"
    CHECK_MAN="$CHECK_MODE_MANUAL"
    CHECK_LOGO="$CHECK_MODE_LOGO"
    CHECK_BANNER="$CHECK_MODE_BANNER"
    CHECK_DEFAULT="$SONDA_DEFAULT"
    CHECK_SYSINFO="$SONDA_SYSINFO"
    CHECK_NETINFO="$SONDA_NETINFO"
    CHECK_CONFIG="$CHECK_MODE_PREFERENCES"
    CHECK_CONFIG_FILE="$CHECK_MODE_CONFIG_FILE"
    
    # ============================================================================
    # AUDIT MODE PATHS
    # ============================================================================
    AUDIT_MODE_LIB_DIR="$AUDIT_MODE_DIR/helpers"
    AUDIT_MODE_MODULES_DIR="$AUDIT_MODE_DIR/modules"
    AUDIT_MODE_DOCS_DIR="$AUDIT_MODE_DIR/docs"
    AUDIT_MODE_PREFERENCES="$AUDIT_MODE_DIR/default.conf"
    
    # Audit mode files
    AUDIT_MODE_STYLE="$SHARED_CORE_DIR/style"
    AUDIT_MODE_LOGIC="$AUDIT_MODE_LIB_DIR/logic"
    AUDIT_MODE_LOGGER="$AUDIT_MODE_LIB_DIR/logger"
    AUDIT_MODE_MANUAL="$AUDIT_MODE_LIB_DIR/man"
    AUDIT_MODE_CONFIG_FILE="$AUDIT_MODE_LIB_DIR/config.sh"
    
    # Audit mode shortcuts (for backward compatibility and convenience)
    AUDIT_LIB="$AUDIT_MODE_LIB_DIR"
    AUDIT_MODULES="$AUDIT_MODE_MODULES_DIR"
    AUDIT_DOCS="$AUDIT_MODE_DOCS_DIR"
    AUDIT_STYLE="$AUDIT_MODE_STYLE"
    AUDIT_LOGIC="$AUDIT_MODE_LOGIC"
    AUDIT_LOGGER="$AUDIT_MODE_LOGGER"
    AUDIT_MAN="$AUDIT_MODE_MANUAL"
    AUDIT_CONFIG="$AUDIT_MODE_PREFERENCES"
    AUDIT_CONFIG_FILE="$AUDIT_MODE_CONFIG_FILE"
    AUDIT_DIR="$AUDIT_MODE_DIR"
    AUDIT_SCRIPT_DIR="$AUDIT_MODE_DIR"
    AUDIT_PROJECT_ROOT="$INSTALLDIR"
    AUDIT_SRC_DIR="$INSTALLDIR"
    
    # Export all variables automatically using set -a
    # This ensures all variables defined above are exported
    set -a
    # All variables are now exported
    set +a
}

# Make function available (don't use export -f as it may not work in all shells)
# The function will be available after sourcing this file
