# Boot Session Auditor Configuration
# This file can be sourced to override default settings
# Settings here will be overridden by command-line arguments

# Default log directory
AUDIT_LOG_DIR="./logs"

# Use filtering rules for log/console output TO BE IMPLEMENTED
# AUDIT_FILTER_RULES=true

# Default console verbosity (true = verbose, false = silent)
AUDIT_VERBOSE=false

# Skip specific phases (space-separated list of phase IDs, e.g., "07 11")
AUDIT_LOG_SKIP_PHASES=""
AUDIT_CONSOLE_SKIP_PHASES=""

# Minimum severity to report (pass, warn, fail) (skipped can't be ignored)
# Only issues at or above this level will be shown
AUDIT_LOG_MIN_LEVEL="warn"
AUDIT_CONSOLE_MIN_LEVEL="warn"

# Maximum number of findings to show per category (0 = no limit)
AUDIT_LOG_MAX_FINDINGS=0
AUDIT_CONSOLE_MAX_FINDINGS=5

# Default timestamp in log/console filenames (true = add timestamp, false = no timestamp)
AUDIT_LOG_TIMESTAMP=true
AUDIT_CONSOLE_TIMESTAMP=false

# Default username in log/console filenames (true = add username, false = no username)
AUDIT_LOG_USER=false
AUDIT_CONSOLE_USER=false

# Advanced Settings

# Enable/disable specific checks TO BE IMPLEMENTED
# AUDIT_ENABLE_SMART=true
# AUDIT_ENABLE_NETWORK_CHECKS=true
# AUDIT_ENABLE_SECURITY_CHECKS=true

# ANONYMIZATION

# Enable anonymization for specific output types (console and/or log)

# Set to "true" to enable anonymization for that output type
# Note: AUDIT_CONSOLE_ANONYMIZE is automatically disabled when AUDIT_VERBOSE=false (silent mode)
#       because there's minimal console output to anonymize
AUDIT_CONSOLE_ANONYMIZE=false
AUDIT_LOG_ANONYMIZE=true

# Define the default behavior for the anonymization:
# - true = write data to the log file first, then anonymize everything by replacing the sensitive data with dummy values
# - false = anonymize everything by replacing the sensitive data with dummy values first, then write the data to the log file
#   - Setting this value to false will make the audit take longer to complete
AUDIT_LOG_ANONYMIZE_AFTER_WRITE=true

# Hide sensitive information (hostname, IPs, etc.) by replacing with dummy values
# Only works if AUDIT_CONSOLE_ANONYMIZE or AUDIT_LOG_ANONYMIZE is set to true
AUDIT_ANONYMIZE_IP=true
AUDIT_ANONYMIZE_HOST=true
AUDIT_ANONYMIZE_USER=true

# Define custom dummy values for the anonymization
AUDIT_DUMMY_IP="153.242.117.210"
AUDIT_DUMMY_HOST="lizard.local"
AUDIT_DUMMY_USER="lizard"
